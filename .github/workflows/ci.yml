name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compose 1.12.0 (composeBom 2026.08.00) সর্বনিম্ন compileSdk=37 চায়।
      # sdkmanager --update দিয়ে repository list আপডেট করতে হবে
      # নাহলে android-37 package খুঁজে পাবে না।
      - name: Update sdkmanager repository and install Android 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          $SDKMANAGER --update
          yes | $SDKMANAGER --licenses
          $SDKMANAGER \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Decode debug keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/boi-khata-debug.keystore

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PdebugKeystore=boi-khata-debug.keystore \
            -PdebugKeystorePassword="${{ secrets.DEBUG_KEYSTORE_PASSWORD }}" \
            -PdebugKeystoreAlias=boikhata-debug
          ./gradlew build --stacktrace \
            -PdebugKeystore=boi-khata-debug.keystore \
            -PdebugKeystorePassword="${{ secrets.DEBUG_KEYSTORE_PASSWORD }}" \
            -PdebugKeystoreAlias=boikhata-debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: boi-khata-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
