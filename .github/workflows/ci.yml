name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode debug keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/boi-khata-debug.keystore

      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug -PdebugKeystore=app/boi-khata-debug.keystore && ./gradlew build --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: boi-khata-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
